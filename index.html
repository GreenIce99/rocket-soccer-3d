<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rocket Soccer 3D</title>
</head>
<body>
  <div id="game">
    <div id="hud">
      <div class="team blue">
        <span>BLUE</span>
        <strong id="blueScore">0</strong>
      </div>

      <div id="timer">3:00</div>

      <div class="team orange">
        <strong id="orangeScore">0</strong>
        <span>ORANGE</span>
      </div>
    </div>

    <div id="boost">
      <span>BOOST</span>
      <div class="boost-track">
        <div id="boostFill"></div>
      </div>
      <strong id="boostValue">100</strong>
    </div>

    <div id="message">
      <h1 id="messageTitle">ROCKET SOCCER</h1>
      <p id="messageSub">Score goals to win!</p>
      <button id="playBtn">PLAY</button>
    </div>

    <div id="controls">
      <span>WASD / ARROWS: DRIVE</span>
      <span>SHIFT: BOOST</span>
      <span>SPACE: JUMP</span>
      <span>C: CAMERA</span>
      <span>R: RESET</span>
      <span>ESC: PAUSE</span>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
